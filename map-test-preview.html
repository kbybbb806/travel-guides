<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>西塘2日游 · 地图效果测试</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#fafbfc;color:#1a1f36;line-height:1.7}
.hero{background:linear-gradient(160deg,#7e1214,#b52830 40%,#d4483a);color:#fff;padding:44px 20px 36px;text-align:center}
.hero h1{font-size:28px;margin-bottom:8px}
.hero .sub{opacity:.92;font-size:14px;max-width:560px;margin:0 auto 14px}
.hero .hm{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:4px 12px;border-radius:20px;font-size:12px;margin:3px}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 50px}
.sec{margin-bottom:28px}
.sec h2{font-size:19px;margin-bottom:12px;padding-left:10px;border-left:4px solid #c0392b}
.route{background:#f5f3f0;border-radius:10px;padding:12px 14px;font-size:13px;color:#697386}
#map{height:380px;border-radius:12px;border:1px solid #e3e8ee;z-index:0}
.day{background:#fff;border:1px solid #e3e8ee;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.dh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.db{background:#c0392b;color:#fff;padding:3px 12px;border-radius:14px;font-size:13px;font-weight:700}
.tl{position:relative;padding:0 0 14px 24px;border-left:2px solid #e8dcd8}
.tl:last-child{border-left-color:transparent}
.td{position:absolute;left:-6px;top:3px;width:11px;height:11px;border-radius:50%;background:#c0392b}
.tt{font-size:12px;font-weight:700;color:#c0392b}
.tc b{font-size:14px}
.tds{font-size:12px;color:#697386;margin-top:2px}
.t{display:inline-block;font-size:11px;padding:1px 8px;border-radius:9px;margin-left:6px;font-weight:700}
.t-eat{background:#fff3e0;color:#e65100}
.hc{background:#fff;border:1px solid #e3e8ee;border-top:3px solid #c0392b;border-radius:10px;padding:14px;margin-bottom:10px}
.hc .hp{color:#c0392b;font-weight:800;font-size:13px}
.hc p{font-size:12px;color:#697386}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:10px;overflow:hidden}
td,th{padding:9px 12px;border-bottom:1px solid #eef1f5;text-align:left}
.num{text-align:right;font-weight:700}
.tip{background:#fff;border:1px solid #e3e8ee;border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:13px}
.footer{text-align:center;padding:20px;font-size:12px;color:#697386;border-top:1px solid #e3e8ee}
@media(max-width:600px){#map{height:300px}.hero h1{font-size:23px}}
</style></head><body>
<div class="hero"><h1>西塘2日游 · 地图效果测试</h1><div class="sub">Leaflet + 腾讯矢量瓦片</div><div><span class="hm">2人</span><span class="hm">¥800/人</span><span class="hm">小吃为主</span></div></div>
<div class="wrap">
  <div class="sec"><h2>行程概览</h2><div class="route">上海虹桥 → 嘉善南 → 西塘古镇</div></div>
  <div class="sec"><h2>🗺 路线地图</h2><div id="map"></div></div>
  <div class="sec"><h2>每日行程</h2><div class="day"><div class="dh"><span class="db">DAY 1</span><b>西街小吃全日游</b></div><div class="tl"><div class="td"></div><div class="tt">09:00</div><div class="tc"><b>陆氏小馄饨</b> <span class="t t-food" style="color:#f59e0b;background:#f59e0b14">美食</span><span class="t t-eat">🍜 必吃</span><div class="tds">早餐</div></div></div><div class="tl"><div class="td"></div><div class="tt">14:00</div><div class="tc"><b>西塘古镇</b> <span class="t t-sight" style="color:#6366f1;background:#6366f114">景点</span><div class="tds">逛古镇</div></div></div></div></div>
  <div class="sec"><h2>住宿推荐</h2><div class="hc"><h4>一朝一夕民宿</h4><div class="hp">¥160起</div><p>4.8分</p></div></div>
  <div class="sec"><h2>费用预估</h2><table><tr><th>项目</th><th style="text-align:right">金额</th><th>说明</th></tr><tr><td>交通</td><td class="num">¥65</td><td>高铁</td></tr><tr><td>餐饮</td><td class="num">¥250</td><td>小吃</td></tr></table></div>
  <div class="sec"><h2>实用贴士</h2><div class="tip"><b>带伞</b></div><div class="tip"><b>早起拍晨雾</b></div></div>
  <div class="footer">攻略由 AI 生成 · 请以实时信息为准 · 晴 28°C</div>
</div>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  var pois = [{lat:30.945,lng:120.889,n:"西塘古镇",t:"全天",c:"#6366f1",d:"江南六大古镇之一",cat:"景点"},
{lat:30.947,lng:120.89,n:"陆氏小馄饨",t:"早餐",c:"#f59e0b",d:"鲜肉小馄饨 ¥10",cat:"美食"},
{lat:30.944,lng:120.892,n:"管老太臭豆腐",t:"小吃",c:"#f59e0b",d:"外酥里嫩 ¥10",cat:"美食"},
{lat:30.946,lng:120.888,n:"烟雨长廊",t:"晨雾",c:"#6366f1",d:"拍照机位",cat:"景点"}];
  var route = [[30.945,120.889],
[30.947,120.89],
[30.944,120.892],
[30.946,120.888]];
  if(!window.L){ document.getElementById("map").innerHTML="<div style=padding:40px;text-align:center>地图组件加载失败，请联网后刷新</div>"; return; }
  var map = L.map("map", {scrollWheelZoom:true, attributionControl:false});
  L.tileLayer("https://rt{s}.map.gtimg.com/tile?z={z}&x={x}&y={y}&type=vector&styleid=3&version=400", {subdomains:["0","1","2","3"], maxZoom:18, tileSize:256, attribution:"&copy; 腾讯地图"}).addTo(map);
  var latlngs=[];
  pois.forEach(function(p,i){
    latlngs.push([p.lat,p.lng]);
    var icon = L.divIcon({className:"my-poi-icon", html:"<div style="width:30px;height:30px;border-radius:50%;background:"+p.c+";color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)">"+(i+1)+"</div>", iconSize:[30,30], iconAnchor:[15,15]});
    L.marker([p.lat,p.lng], {icon:icon}).addTo(map).bindPopup("<div style="min-width:160px;max-width:240px"><b>"+(i+1)+". "+p.n+"</b><br><span style="color:#697386;font-size:12px">"+p.t+" &middot; "+p.cat+"</span><div style="font-size:12px;color:#333;margin-top:4px">"+p.d+"</div></div>");
  });
  if(route.length>1) L.polyline(route, {color:"#3b82f6", weight:4, opacity:.9}).addTo(map);
  if(latlngs.length) map.fitBounds(latlngs, {padding:[40,40]}); else map.setView([30.7,120.7],8);
})();
</script>
</body></html>
