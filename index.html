<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杭州出发 · 周末游三方案</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#7e1214 0%,#b52830 60%,#d4483a 100%);min-height:100vh;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{max-width:760px;width:100%}
h1{font-size:30px;font-weight:800;text-align:center;margin-bottom:8px;letter-spacing:2px}
.sub{text-align:center;opacity:.9;font-size:14px;margin-bottom:32px}
.card{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:22px 24px;margin-bottom:16px;display:flex;align-items:center;gap:18px;text-decoration:none;color:#fff;transition:.2s;backdrop-filter:blur(6px)}
.card:hover{background:rgba(255,255,255,.22);transform:translateY(-2px)}
.emoji{font-size:40px;flex-shrink:0}
.info{flex:1}
.info b{font-size:18px;display:block;margin-bottom:4px}
.info span{font-size:13px;opacity:.85;line-height:1.6;display:block}
.go{font-size:22px;opacity:.8}
.badge{display:inline-block;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);padding:2px 10px;border-radius:12px;font-size:11px;margin-right:6px}
@media(max-width:600px){h1{font-size:24px}.card{padding:16px}.emoji{font-size:32px}}
</style>
</head>
<body>
<div class="wrap">

</div>
